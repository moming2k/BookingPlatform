version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: booking_platform_postgres
    environment:
      POSTGRES_USER: booking_platform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booking_platform_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: schickling/mailcatcher
    container_name: booking_platform_mailcatcher
    ports:
      - "1080:1080"  # Web interface
      - "1025:1025"  # SMTP server

  web:
    build: .
    container_name: booking_platform_web
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: booking_platform
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
    stdin_open: true
    tty: true

  sidekiq:
    build: .
    container_name: booking_platform_sidekiq
    command: bundle exec sidekiq
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: booking_platform
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: development

  tailwind:
    build: .
    container_name: booking_platform_tailwind
    command: rails tailwindcss:watch
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    environment:
      RAILS_ENV: development
    profiles:
      - development

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules: